# The fullstack app. It serves its own API, so it needs no separate API service.
# The data services live in `compose.data.yaml`.

x-logging: &logging
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "5"

services:
    # The app uploads from its own address whenever another app owns "/", so the
    # store must accept that origin too. The data fragment owns
    # S3_CORS_ALLOW_ORIGIN, and an `include` merge keeps the first value of a key
    # two files declare, so this fragment adds a key of its own.
    objectstore-init:
        environment:
            S3_CORS_EXTRA_ORIGIN: https://${FOMOFOBO_DOMAIN:-fomofobo.localhost}

    caddy:
        environment:
            # Read by sites/fullstack-fomofobo.caddy, which a project gets only when
            # another app owns "/" on DOMAIN.
            FOMOFOBO_DOMAIN: ${FOMOFOBO_DOMAIN:-fomofobo.localhost}
        depends_on:
            fullstack-fomofobo:
                condition: service_healthy

    fullstack-fomofobo:
        build:
            context: ../../
            dockerfile: infra/docker/Dockerfile
            target: nextjs
            args:
                APP_DIR: apps/fullstack-fomofobo
        restart: unless-stopped
        <<: *logging
        environment:
            # Deployment switch. Drives DB SSL, error verbosity and the API
            # documentation (src/server/config/app-config.ts).
            APP_ENV: docker
            NODE_ENV: production
            PORT: "3000"
            HOSTNAME: "0.0.0.0"
            PGHOST: postgres
            PGPORT: "5432"
            PGUSER: postgres
            PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in infra/docker/.env}
            PGDATABASE: postgres
            # CRITICAL: the browser calls this host directly, because the app
            # bakes it into every presigned URL. "objectstore:9000" resolves
            # inside the Docker network only, so it cannot work here.
            S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT in infra/docker/.env}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in infra/docker/.env}
            S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in infra/docker/.env}
            S3_BUCKET: ${S3_BUCKET:-fomofobo}
            S3_REGION: ${S3_REGION:-eu-west-1}
            # OpenID provider. The app signs every visitor in, so a stack with no
            # provider serves no page but the public ones.
            OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in infra/docker/.env}
            OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in infra/docker/.env}
            OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
            OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set OIDC_AUDIENCE in infra/docker/.env}
            # Every redirect URI is built from it, and the provider holds the result.
            # It defaults to FOMOFOBO_DOMAIN, which the app answers on whenever another
            # app owns "/" on DOMAIN. Set it by hand in a stack where this app owns
            # "/" itself, because FOMOFOBO_DOMAIN goes unrouted there.
            APP_BASE_URL: ${APP_BASE_URL:-https://${DOMAIN:-localhost}}
        expose:
            - "3000"
        depends_on:
            postgres:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
            objectstore:
                condition: service_healthy
            objectstore-init:
                condition: service_completed_successfully
        healthcheck:
            # /api/health, not /api/swagger: the API documentation is off in a
            # deployed build.
            test:
                [
                    "CMD-SHELL",
                    'node -e "fetch(''http://localhost:3000/api/health'').then(r=>{if(!r.ok)throw 1})"',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
