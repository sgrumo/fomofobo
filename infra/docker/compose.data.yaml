# The data services every backend needs: database, object store, migration gate.
# Every backend attaches to them, so no backend owns them.

x-logging: &logging
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "5"

x-build: &build
    context: ../../
    dockerfile: infra/docker/Dockerfile

services:
    caddy:
        environment:
            S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-s3.localhost}

    migrations:
        build:
            <<: *build
            target: migrations
        <<: *logging
        environment:
            PGHOST: postgres
            PGPORT: "5432"
            PGUSER: postgres
            PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in infra/docker/.env}
            PGDATABASE: postgres
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:18.6-trixie@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
        restart: unless-stopped
        <<: *logging
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in infra/docker/.env}
            POSTGRES_DB: postgres
        volumes:
            # PG 18+ keeps data in a per-major subdirectory (18/main), so the
            # volume mounts one level above it. Do NOT "fix" this to .../data:
            # pg_upgrade --link needs the parent to see both versions. A major
            # image bump on existing data fails until pg_upgrade has run.
            - postgres_data:/var/lib/postgresql
        expose:
            - "5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5

    # S3-compatible object storage. Kept PRIVATE (no anonymous access); the
    # browser only ever touches it via presigned URLs. Caddy reverse-proxies
    # the S3 API at the public S3_PUBLIC_DOMAIN so those presigned URLs resolve.
    objectstore:
        image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4
        restart: unless-stopped
        <<: *logging
        environment:
            RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in infra/docker/.env}
            RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in infra/docker/.env}
            RUSTFS_REGION: ${S3_REGION:-eu-west-1}
            RUSTFS_CONSOLE_ENABLE: "false"
            # Empty sends the logs to stdout. The image default (/logs) writes
            # them to a file that no volume holds and no rotation trims.
            RUSTFS_OBS_LOG_DIRECTORY: ""
        volumes:
            - objectstore_data:/data
        expose:
            - "9000"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/ | grep -q 403",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    # One-shot: create the bucket, then write its CORS rules. Gates the apps the
    # same way `migrations` does, so no app writes control-plane state.
    objectstore-init:
        build:
            <<: *build
            target: objectstore-init
        restart: "no"
        <<: *logging
        environment:
            S3_ENDPOINT: http://objectstore:9000
            S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in infra/docker/.env}
            S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in infra/docker/.env}
            S3_BUCKET: ${S3_BUCKET:-fomofobo}
            S3_REGION: ${S3_REGION:-eu-west-1}
            # Comma-separated. Every page that uploads needs its origin listed,
            # because the browser calls the store directly. This fragment names no
            # app, so the default covers the main domain alone; an app that answers
            # on an address of its own extends the list from its own fragment.
            S3_CORS_ALLOW_ORIGIN: ${S3_CORS_ALLOW_ORIGIN:-https://${DOMAIN:-localhost}}
        depends_on:
            objectstore:
                condition: service_healthy

volumes:
    postgres_data:
    objectstore_data:
