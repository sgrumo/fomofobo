name: Deploy (Docker Compose)

# Copies the repo to a server, then runs `docker compose up`.
# One stack serves every app the project holds, so the compose file is fixed.
# Compose reads infra/docker/.env on the server, next to the file.

on:
    workflow_call:
        inputs:
            environment:
                description: Deploy environment. It names the GitHub environment, which holds the host.
                type: string
                required: true
        secrets:
            DEPLOY_SSH_KEY:
                required: true

jobs:
    deploy:
        name: Docker Deploy
        environment: ${{ inputs.environment }}
        runs-on: ["self-hosted", "Linux", "X64"]
        env:
            # LAN address: the runner shares the NAT of the server, so the public one fails with `no route to host`.
            DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
            DEPLOY_USER: ${{ vars.DEPLOY_USER }}
            DEPLOY_PATH: ${{ vars.DEPLOY_PATH || github.event.repository.name }}
        steps:
            - uses: actions/checkout@v7

            - name: Copy files to server
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ env.DEPLOY_HOST }}
                  username: ${{ env.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  source: "."
                  target: ${{ env.DEPLOY_PATH }}

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ env.DEPLOY_HOST }}
                  username: ${{ env.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  envs: DEPLOY_PATH
                  script: |
                      set -e
                      cd "$DEPLOY_PATH/infra/docker"
                      docker compose up -d --build --remove-orphans
