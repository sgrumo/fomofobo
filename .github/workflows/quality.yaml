name: Quality

on:
    workflow_call:
        outputs:
            vercel:
                description: "True when the changes reach the deploy of fullstack-fomofobo"
                value: ${{ jobs.changes.outputs.vercel }}

permissions:
    contents: read
    # dorny/test-reporter creates the "Test Report" check run.
    checks: write
    # dorny/test-reporter reads the workflow run in a private repo.
    actions: read
    # dorny/paths-filter lists the PR files through the API.
    pull-requests: read

jobs:
    # Maps the changes of the event to the parts of the repo they reach. A manual run
    # reaches every part.
    changes:
        name: Detect changes
        runs-on: ubuntu-latest
        container:
            image: node:24.19.0-bookworm
        outputs:
            web: ${{ steps.detect.outputs.web }}
            mobile: ${{ steps.detect.outputs.mobile }}
            vercel: ${{ steps.detect.outputs.vercel }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Mark workspace as safe for git
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
            - uses: ./.github/actions/setup-monorepo
              with:
                  install: "false"
            - id: detect
              run: node .github/scripts/detect-changes.mjs
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

    build-and-check:
        name: Build, Typecheck & Lint
        runs-on: ubuntu-latest
        container:
            image: node:24.19.0-bookworm
        needs: changes
        if: needs.changes.outputs.web == 'true'
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-monorepo
            - name: Build all packages
              run: pnpm -r --if-present --filter '!mobile-fomofobo' run build
            - name: Typecheck
              run: pnpm -r --if-present --filter '!mobile-fomofobo' run typecheck
            - name: Lint
              run: pnpm -r --if-present --filter '!mobile-fomofobo' run lint

    # The mobile app has no E2E suite, and its native builds run on a Mac by hand.
    mobile-check:
        name: Mobile Typecheck & Lint
        runs-on: ubuntu-latest
        container:
            image: node:24.19.0-bookworm
        needs: changes
        if: needs.changes.outputs.mobile == 'true'
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-monorepo
            - name: Typecheck
              run: pnpm -C apps/mobile-fomofobo typecheck
            - name: Lint
              run: pnpm -C apps/mobile-fomofobo lint

    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        container:
            image: node:24.19.0-bookworm
        needs: build-and-check
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-monorepo
            - name: Run unit tests
              run: pnpm -r --if-present --filter '!mobile-fomofobo' run test
            - name: Upload unit test reports
              if: ${{ !cancelled() }}
              continue-on-error: true
              uses: actions/upload-artifact@v7
              with:
                  name: junit-unit
                  path: .ignored/tests/*.junit.xml
                  include-hidden-files: true
                  if-no-files-found: ignore
                  retention-days: 1

    e2e-fomofobo:
        needs: build-and-check
        uses: ./.github/workflows/quality-e2e.yaml
        with:
            suite: fullstack-fomofobo
            browser: true

    e2e-photo-purge:
        needs: build-and-check
        uses: ./.github/workflows/quality-e2e.yaml
        with:
            suite: photo-purge

    test-report:
        name: Test Report
        runs-on: ubuntu-latest
        container:
            image: node:24.19.0-bookworm
        needs:
            - changes
            - unit-tests
            - e2e-fomofobo
            - e2e-photo-purge
        if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
        steps:
            - uses: actions/checkout@v7
            - name: Mark workspace as safe for git
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
            - uses: actions/download-artifact@v8
              continue-on-error: true
              with:
                  pattern: junit-*
                  path: test-reports
                  merge-multiple: true
            - uses: dorny/test-reporter@v3
              with:
                  name: Test Report
                  path: test-reports/*.junit.xml
                  reporter: java-junit
                  list-suites: failed
                  list-tests: failed
                  fail-on-error: false
                  fail-on-empty: false
