name: Deploy Vercel

# Reusable Vercel deploy, one call per app. Uses the prebuilt flow: `vercel pull`
# fetches the project settings, `vercel build` produces `.vercel/output` on the
# runner, and `vercel deploy --prebuilt` uploads only that output.
#
# Each deploy environment has its own Vercel project, and every deploy goes to the
# Production target of that project. The job reads `VERCEL_PROJECT_ID` from its GitHub
# environment, so the environment selects the project. Set the Root Directory of each
# project to the app directory before the first deploy: it is a project setting, not a
# `vercel.json` key. See infra/vercel/README.md.

on:
    workflow_call:
        inputs:
            app:
                description: "App being deployed (display only — the project id selects it)"
                required: true
                type: string
            environment:
                description: "Deploy environment. It names the GitHub environment, which holds the Vercel project id"
                required: true
                type: string
        secrets:
            VERCEL_TOKEN:
                required: true

permissions:
    contents: read

jobs:
    deploy:
        name: Deploy ${{ inputs.app }} (Vercel)
        environment: ${{ inputs.environment }}
        runs-on: ["self-hosted", "Linux", "X64"]
        container:
            image: node:24.19.0-bookworm
        env:
            VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
            # A GitHub environment variable: one Vercel project per deploy environment.
            VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        steps:
            - uses: actions/checkout@v7

            # pnpm + Node only: `vercel build` runs the project's own install command
            # against the workspace, so a second install here only costs time.
            - uses: ./.github/actions/setup-monorepo
              with:
                  install: "false"

            - name: Pull Vercel environment
              run: >-
                  npx vercel@latest pull --yes
                  --environment=production
                  --token=${{ secrets.VERCEL_TOKEN }}

            - name: Build project artifacts
              run: >-
                  npx vercel@latest build --prod
                  --token=${{ secrets.VERCEL_TOKEN }}

            # CRITICAL: the upload must not see a git repository.
            #
            # With git metadata in reach, Vercel attributes the deployment to the
            # commit author and then requires that author to be a member of the team.
            # A deploy of someone else's commit is refused. Without the metadata
            # Vercel runs no such check.
            #
            # Copying the two things `--prebuilt` needs into a directory outside the
            # workspace gets that, and leaves the checkout intact. Deleting `.git` in
            # place works too, and is what some of our repos do, but it destroys the
            # checkout the runner reuses.
            #
            # `$RUNNER_TEMP` is the runner's own variable, read by the shell. The
            # `runner` context is out of reach in the `env` of a job, so a
            # `${{ runner.temp }}` there makes the whole file invalid.
            - name: Stage the upload outside the repository
              run: |
                  mkdir -p "$RUNNER_TEMP/vercel-upload"
                  cp -R .vercel "$RUNNER_TEMP/vercel-upload/.vercel"
                  test ! -e "$RUNNER_TEMP/vercel-upload/.git"

            # `--archive=tgz` uploads one tarball in place of each file. A per-file
            # upload of `.vercel/output` hits the Vercel API rate limit.
            - name: Deploy prebuilt artifacts
              id: deploy
              run: |
                  URL=$(npx vercel@latest deploy --prebuilt --archive=tgz --prod \
                    --cwd "$RUNNER_TEMP/vercel-upload" \
                    --token=${{ secrets.VERCEL_TOKEN }})
                  echo "url=${URL}" >> "$GITHUB_OUTPUT"

            - name: Deployment summary
              if: always()
              run: |
                  {
                      echo "### Vercel deploy 🚀"
                      echo ""
                      echo "**App:** ${{ inputs.app }}"
                      echo "**Environment:** ${{ inputs.environment }}"
                      echo "**URL:** ${{ steps.deploy.outputs.url }}"
                      echo "**Branch:** ${{ github.ref_name }}"
                      echo "**Commit:** ${{ github.sha }}"
                  } >> "$GITHUB_STEP_SUMMARY"
