name: Deploy Cloudflare

# Reusable Cloudflare Workers deploy of the app. See infra/cloudflare/README.md.

on:
    workflow_call:
        inputs:
            environment:
                description: "Deploy environment. It names the GitHub environment and the wrangler env"
                required: true
                type: string
        secrets:
            CLOUDFLARE_API_TOKEN:
                description: "Workers Scripts, D1 and R2 edit on the account"
                required: true

permissions:
    contents: read

jobs:
    deploy:
        name: Deploy fullstack-fomofobo (Cloudflare)
        environment: ${{ inputs.environment }}
        runs-on: ["self-hosted", "Linux", "X64"]
        container:
            image: node:24.19.0-bookworm
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        defaults:
            run:
                working-directory: apps/fullstack-fomofobo
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup-monorepo

            - name: Build the Worker bundle
              run: pnpm build:worker

            # Before the upload: the new code can rely on the new schema.
            - name: Apply D1 migrations
              run: pnpm exec wrangler d1 migrations apply DB --remote --env ${{ inputs.environment }}

            - name: Deploy the Worker
              run: pnpm exec opennextjs-cloudflare deploy --env ${{ inputs.environment }}

            - name: Deployment summary
              if: always()
              working-directory: .
              run: |
                  {
                      echo "### Cloudflare deploy 🚀"
                      echo ""
                      echo "**Environment:** ${{ inputs.environment }}"
                      echo "**Branch:** ${{ github.ref_name }}"
                      echo "**Commit:** ${{ github.sha }}"
                  } >> "$GITHUB_STEP_SUMMARY"
